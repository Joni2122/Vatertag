<!DOCTYPE html><html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Wetter Challenge</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #1e3a8a, #020617 70%);
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
}.container { width: 90%; max-width: 900px; background: rgba(15,23,42,0.9); border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 0 40px rgba(59,130,246,0.4); }

h1 { font-size: 3.5rem; margin-bottom: 10px; background: linear-gradient(90deg,#38bdf8,#a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.subtitle { color: #cbd5e1; margin-bottom: 20px; font-size: 1.1rem; }

canvas { background: #0f172a; border-radius: 20px; border: 4px solid #38bdf8; display: block; margin: 20px auto; max-width: 100%; }

#score { font-size: 1.4rem; margin-top: 15px; color: #38bdf8; font-weight: bold; }

button { border: none; border-radius: 15px; padding: 14px 24px; margin: 10px; background: linear-gradient(135deg,#38bdf8,#7c3aed); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }

button:hover { transform: scale(1.05); }

.hidden { display: none; }

.result { margin-top: 25px; padding: 25px; border-radius: 20px; background: rgba(255,255,255,0.06); }

.emoji { font-size: 4rem; } </style>

</head>
<body>
<div class="container">
  <h1>🎮 Wetter Challenge</h1>
  <div class="subtitle">Sammle 10 Sterne um den Plan für morgen freizuschalten!</div><canvas id="gameCanvas" width="700" height="400"></canvas>

  <div id="score">Punkte: 0 / 10</div>  <div id="choiceBox" class="hidden">
    <h2>🎉 Geschafft!</h2>
    <p>Wie wird das Wetter morgen?</p><button onclick="showPlan('good')">☀️ Gutes Wetter</button>
<button onclick="showPlan('bad')">🌧️ Schlechtes Wetter</button>

  </div>  <div id="result" class="result hidden"></div>
</div><script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const player = {
  x: 100,
  y: 100,
  size: 30,
  speed: 5
};

const star = {
  x: 300,
  y: 200,
  size: 18
};

const keys = {};
let score = 0;

function randomStar() {
  star.x = Math.random() * (canvas.width - 40) + 20;
  star.y = Math.random() * (canvas.height - 40) + 20;
}

window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
});

window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

function update() {
  if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s']) player.y += player.speed;

  if (player.x < 0) player.x = 0;
  if (player.y < 0) player.y = 0;
  if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
  if (player.y > canvas.height - player.size) player.y = canvas.height - player.size;

  const dx = player.x + player.size / 2 - star.x;
  const dy = player.y + player.size / 2 - star.y;
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance < player.size) {
    score++;
    document.getElementById('score').innerText = `Punkte: ${score} / 10`;
    randomStar();

    if (score >= 10) {
      document.getElementById('choiceBox').classList.remove('hidden');
    }
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<60;i++) {
    ctx.fillStyle = 'white';
    ctx.fillRect((i*47)%canvas.width,(i*83)%canvas.height,2,2);
  }

  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(player.x, player.y, player.size, player.size);

  ctx.beginPath();
  ctx.fillStyle = '#facc15';
  ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

function showPlan(type) {
  const result = document.getElementById('result');
  result.classList.remove('hidden');

  if(type === 'good') {
    result.innerHTML = `
      <div class="emoji">☀️⛰️🎲</div>
      <h2>Plan bei gutem Wetter</h2>
      <p>
      Wir gehen hoch zur Hoggetse und essen dort etwas 🍔<br><br>
      Danach machen wir einen Spieleabend 🎮🎲
      </p>
    `;
  } else {
    result.innerHTML = `
      <div class="emoji">🌧️🎬🍕</div>
      <h2>Plan bei schlechtem Wetter</h2>
      <p>
      Wir gehen ins Kino 🍿<br><br>
      Filme:<br>
      🎥 Die 3 Fragezeichen<br>
      🎥 Hoopers<br>
      🎥 Checker Tobi<br><br>
      Oder Spielenachmittag mit Essen bestellen 🍕
      </p>
    `;
  }
}
</script></body>
</html>
