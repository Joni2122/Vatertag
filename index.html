<!DOCTYPE html><html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Wetter Challenge</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(-45deg, #020617, #0f172a, #312e81, #7c3aed, #0891b2, #020617);
  background-size: 500% 500%;
  animation: neonFlow 18s ease infinite;
  position: relative;
}body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.25), transparent 25%), radial-gradient(circle at 80% 30%, rgba(168,85,247,0.25), transparent 30%), radial-gradient(circle at 50% 80%, rgba(236,72,153,0.18), transparent 30%); filter: blur(40px); animation: pulseGlow 10s ease-in-out infinite alternate; pointer-events: none; }

@keyframes neonFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

@keyframes pulseGlow { from { transform: scale(1); opacity: 0.7; } to { transform: scale(1.15); opacity: 1; } }

.container { width: 90%; max-width: 950px; background: rgba(10,15,35,0.72); border-radius: 35px; padding: 35px; text-align: center; position: relative; z-index: 1; backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 25px rgba(56,189,248,0.25), 0 0 60px rgba(168,85,247,0.25), inset 0 0 25px rgba(255,255,255,0.03); overflow: hidden; }

.container::before { content: ''; position: absolute; inset: -2px; background: linear-gradient(45deg,#38bdf8,#7c3aed,#ec4899,#38bdf8); background-size: 300% 300%; animation: neonBorder 8s linear infinite; z-index: -2; border-radius: 35px; }

.container::after { content: ''; position: absolute; inset: 3px; background: rgba(10,15,35,0.92); border-radius: 32px; z-index: -1; }

@keyframes neonBorder { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

h1 { font-size: 4rem; margin-bottom: 12px; background: linear-gradient(90deg,#38bdf8,#a855f7,#ec4899,#38bdf8); background-size: 300% 300%; animation: titleGlow 6s linear infinite; -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 35px rgba(56,189,248,0.35); letter-spacing: 2px; }

@keyframes titleGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

.subtitle { color: #cbd5e1; margin-bottom: 20px; font-size: 1.1rem; }

canvas { background: linear-gradient(180deg,#020617,#0f172a); border-radius: 25px; border: 3px solid rgba(56,189,248,0.6); display: block; margin: 25px auto; max-width: 100%; box-shadow: 0 0 25px rgba(56,189,248,0.35), 0 0 70px rgba(168,85,247,0.15), inset 0 0 25px rgba(255,255,255,0.03); }

#score { font-size: 1.4rem; margin-top: 15px; color: #38bdf8; font-weight: bold; }

button { border: none; border-radius: 18px; padding: 15px 28px; margin: 12px; background: linear-gradient(135deg,#38bdf8,#7c3aed,#ec4899); background-size: 250% 250%; animation: buttonFlow 5s ease infinite; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.25s; box-shadow: 0 0 20px rgba(56,189,248,0.3), 0 0 35px rgba(168,85,247,0.2); }

button:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 0 30px rgba(236,72,153,0.45), 0 0 60px rgba(56,189,248,0.35); }

@keyframes buttonFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

button:hover { transform: scale(1.05); }

.hidden { display: none; }

.result { margin-top: 25px; padding: 25px; border-radius: 20px; background: rgba(255,255,255,0.06); }

.emoji { font-size: 4rem; } </style>

</head>
<body>
<div class="container">
  <h1>🎮 Dodge Challenge</h1>
  <div class="subtitle">Weiche den roten Gegnern aus! Überlebe 20 Sekunden um den Plan freizuschalten.</div><canvas id="gameCanvas" width="700" height="400"></canvas>

  <div id="score">Überlebt: 0 Sekunden</div>  <div id="choiceBox" class="hidden">
    <h2>🎉 Du hast gewonnen!</h2>
    <p>Wie wird das Wetter morgen?</p><button onclick="showPlan('good')">☀️ Gutes Wetter</button>
<button onclick="showPlan('bad')">🌧️ Schlechtes Wetter</button>

  </div>  <div id="result" class="result hidden"></div>
</div><script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const player = {
  x: 350,
  y: 200,
  size: 25,
  speed: 6
};

const keys = {};

const enemies = [];
for(let i = 0; i < 6; i++) {
  enemies.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: 25,
    vx: (Math.random() * 4 + 2) * (Math.random() > 0.5 ? 1 : -1),
    vy: (Math.random() * 4 + 2) * (Math.random() > 0.5 ? 1 : -1)
  });
}

let survived = 0;
let gameOver = false;
let won = false;

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

function movePlayer() {
  if(keys['w'] || keys['arrowup']) player.y -= player.speed;
  if(keys['s'] || keys['arrowdown']) player.y += player.speed;
  if(keys['a'] || keys['arrowleft']) player.x -= player.speed;
  if(keys['d'] || keys['arrowright']) player.x += player.speed;

  if(player.x < 0) player.x = 0;
  if(player.y < 0) player.y = 0;
  if(player.x > canvas.width - player.size) player.x = canvas.width - player.size;
  if(player.y > canvas.height - player.size) player.y = canvas.height - player.size;
}

function moveEnemies() {
  enemies.forEach(enemy => {
    enemy.x += enemy.vx;
    enemy.y += enemy.vy;

    if(enemy.x < 0 || enemy.x > canvas.width - enemy.size) enemy.vx *= -1;
    if(enemy.y < 0 || enemy.y > canvas.height - enemy.size) enemy.vy *= -1;

    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const distance = Math.sqrt(dx*dx + dy*dy);

    if(distance < player.size) {
      gameOver = true;
    }
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const gradient = ctx.createLinearGradient(0,0,0,400);
  gradient.addColorStop(0,'#0f172a');
  gradient.addColorStop(1,'#020617');
  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i = 0; i < 70; i++) {
    ctx.fillStyle = 'white';
    ctx.fillRect((i*91)%canvas.width,(i*53)%canvas.height,2,2);
  }

  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(player.x + player.size/2, player.y + player.size/2, player.size/2, 0, Math.PI*2);
  ctx.fill();

  enemies.forEach(enemy => {
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(enemy.x + enemy.size/2, enemy.y + enemy.size/2, enemy.size/2, 0, Math.PI*2);
    ctx.fill();
  });
}

let start = Date.now();

function loop() {
  if(gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = 'white';
    ctx.font = '50px Arial';
    ctx.fillText('Game Over', 220, 180);

    ctx.font = '24px Arial';
    ctx.fillText('Seite neu laden zum Neustarten', 190, 240);
    return;
  }

  if(!won) {
    survived = Math.floor((Date.now() - start)/1000);
    document.getElementById('score').innerText = `Überlebt: ${survived} / 20 Sekunden`;

    if(survived >= 20) {
      won = true;
      document.getElementById('choiceBox').classList.remove('hidden');
    }
  }

  movePlayer();
  moveEnemies();
  draw();

  requestAnimationFrame(loop);
}

loop();

function showPlan(type) {
  const result = document.getElementById('result');
  result.classList.remove('hidden');

  if(type === 'good') {
    result.innerHTML = `
      <div class="emoji">☀️⛰️🎲</div>
      <h2>Plan bei gutem Wetter</h2>
      <p>
      Wir gehen hoch zur Hoggetse und essen dort etwas 🍔<br><br>
      Danach machen wir einen Spieleabend 🎮🎲
      </p>
    `;
  } else {
    result.innerHTML = `
      <div class="emoji">🌧️🎬🍕</div>
      <h2>Plan bei schlechtem Wetter</h2>
      <p>
      Wir gehen ins Kino 🍿<br><br>
      Filme:<br>
      🎥 Die 3 Fragezeichen<br>
      🎥 Hoopers<br>
      🎥 Checker Tobi<br><br>
      Oder Spielenachmittag mit Essen bestellen 🍕
      </p>
    `;
  }
}
</script></body>
</html>
