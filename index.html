<!DOCTYPE html><html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Pong Battle</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  color:white;
  background: linear-gradient(-45deg,#050816,#1a0b2e,#0b2a3d,#050816);
  background-size:400% 400%;
  animation: bg 12s ease infinite;
}
@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}.container{ text-align:center; }

h1{ margin-bottom:10px; font-size:2.5rem; background:linear-gradient(90deg,#00e5ff,#ff3df2,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

canvas{ background:#050816; border:2px solid #00e5ff; box-shadow:0 0 25px #00e5ff; border-radius:12px; }

button{ margin-top:15px; padding:10px 18px; border:none; border-radius:10px; background:linear-gradient(90deg,#00e5ff,#7c3aed); color:white; font-weight:bold; cursor:pointer; }

.score{ margin:10px; font-size:1.2rem; } </style>

</head>
<body><div class="container">
<h1>⚡ NEON PONG BATTLE</h1>
<canvas id="game" width="800" height="400"></canvas>
<div class="score" id="score">0 : 0</div>
<button onclick="reset()">Neustart</button>
</div><script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let left = {x:20,y:160,w:10,h:80,score:0};
let right = {x:770,y:160,w:10,h:80,score:0};

let ball = {x:400,y:200,vx:4,vy:3,r:8};

let keys = {};

document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function resetBall(){
  ball.x=400;
  ball.y=200;
  ball.vx = (Math.random()>0.5?4:-4);
  ball.vy = (Math.random()*4-2);
}

function draw(){
  ctx.clearRect(0,0,800,400);

  ctx.fillStyle="#00e5ff";
  ctx.fillRect(left.x,left.y,left.w,left.h);
  ctx.fillRect(right.x,right.y,right.w,right.h);

  ctx.beginPath();
  ctx.fillStyle="#ff3df2";
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.fillRect(398,0,4,400);
}

function update(){
  // player
  if(keys['w']) left.y -= 6;
  if(keys['s']) left.y += 6;

  left.y = Math.max(0,Math.min(320,left.y));

  // AI
  right.y += (ball.y - (right.y+40))*0.08;

  // ball
  ball.x += ball.vx;
  ball.y += ball.vy;

  if(ball.y<0||ball.y>400) ball.vy*=-1;

  // left paddle
  if(ball.x<left.x+left.w && ball.y>left.y && ball.y<left.y+left.h){
    ball.vx*=-1;
  }

  // right paddle
  if(ball.x>right.x && ball.y>right.y && ball.y<right.y+right.h){
    ball.vx*=-1;
  }

  // score
  if(ball.x<0){
    right.score++;
    resetBall();
  }
  if(ball.x>800){
    left.score++;
    resetBall();
  }

  document.getElementById('score').innerText = left.score + " : " + right.score;
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

function reset(){
  left.score=0;
  right.score=0;
  resetBall();
}
</script></body>
</html>
